name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release contract
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:RELEASE_TAG -notmatch '^v(?<numeric>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))(?<prerelease>-beta\.(0|[1-9]\d*))?$') {
              throw "Release tags must use SemVer: vX.Y.Z or vX.Y.Z-beta.N."
          }

          $numeric = $Matches["numeric"]
          $prerelease = $Matches["prerelease"]
          $version = $numeric + $prerelease
          $isPrerelease = -not [string]::IsNullOrEmpty($prerelease)

          git show-ref --verify --quiet refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
              throw "Checkout did not fetch origin/main."
          }

          git merge-base --is-ancestor $env:RELEASE_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
              throw "Release commit $($env:RELEASE_SHA) is not reachable from origin/main."
          }

          $releaseUri = "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/releases/tags/$($env:RELEASE_TAG)"
          $releaseResponse = Invoke-WebRequest `
              -Uri $releaseUri `
              -Headers @{
                  Accept = "application/vnd.github+json"
                  Authorization = "Bearer $($env:GH_TOKEN)"
                  "X-GitHub-Api-Version" = "2022-11-28"
              } `
              -SkipHttpErrorCheck

          if ($releaseResponse.StatusCode -eq 200) {
              throw "GitHub Release $($env:RELEASE_TAG) already exists; inspect or remove it before rerunning."
          }

          if ($releaseResponse.StatusCode -ne 404) {
              throw "Could not verify release absence. GitHub returned HTTP $($releaseResponse.StatusCode)."
          }

          $lines = Get-Content -LiteralPath "CHANGELOG.md"
          $headerPattern = '^## \[' + [Regex]::Escape($version) + '\] - (?<date>\d{4}-\d{2}-\d{2})$'
          $headingIndexes = @()
          $releaseDateText = $null

          for ($index = 0; $index -lt $lines.Count; $index++) {
              if ($lines[$index] -match $headerPattern) {
                  $headingIndexes += $index
                  $releaseDateText = $Matches["date"]
              }
          }

          if ($headingIndexes.Count -ne 1) {
              throw "CHANGELOG.md must contain exactly one '## [$version] - YYYY-MM-DD' heading."
          }

          $releaseDate = [DateTime]::MinValue
          $validDate = [DateTime]::TryParseExact(
              $releaseDateText,
              "yyyy-MM-dd",
              [Globalization.CultureInfo]::InvariantCulture,
              [Globalization.DateTimeStyles]::None,
              [ref] $releaseDate)
          if (-not $validDate) {
              throw "The CHANGELOG.md date for $version is not a valid YYYY-MM-DD date."
          }

          $bodyStart = $headingIndexes[0] + 1
          $bodyEnd = $lines.Count
          for ($index = $bodyStart; $index -lt $lines.Count; $index++) {
              if ($lines[$index] -match '^## ') {
                  $bodyEnd = $index
                  break
              }
          }

          $body = if ($bodyStart -lt $bodyEnd) {
              @($lines[$bodyStart..($bodyEnd - 1)])
          }
          else {
              @()
          }
          if (-not ($body | Where-Object { $_ -match '\S' })) {
              throw "The CHANGELOG.md section for $version must not be empty."
          }

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes-$version.md"
          Set-Content -LiteralPath $notesPath -Value ($body -join [Environment]::NewLine)

          "version=$version" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "numeric_version=$numeric" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "is_prerelease=$($isPrerelease.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "archive_name=Power-BI-Launcher-v$version-win-x64.zip" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "notes_path=$notesPath" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "Power BI Launcher.Tests/Power BI Launcher.Tests.csproj"

      - name: Test
        run: >
          dotnet test "Power BI Launcher.Tests/Power BI Launcher.Tests.csproj"
          -c Release
          --no-restore
          --logger trx
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ReleaseTestResults-${{ github.ref_name }}
          path: TestResults

      - name: Publish portable launcher
        env:
          LAUNCHER_VERSION: ${{ steps.release.outputs.version }}
        run: >
          dotnet publish "Power BI Launcher/Power BI Launcher.csproj"
          -p:PublishProfile=PortableProfile
          -p:Version="$env:LAUNCHER_VERSION"

      - name: Package and verify release assets
        id: assets
        shell: pwsh
        env:
          ARCHIVE_NAME: ${{ steps.release.outputs.archive_name }}
          LAUNCHER_VERSION: ${{ steps.release.outputs.version }}
          NUMERIC_VERSION: ${{ steps.release.outputs.numeric_version }}
        run: |
          $ErrorActionPreference = "Stop"

          $publishRoot = (Resolve-Path "Power BI Launcher/bin/publish/win-x64").Path
          $launcherPath = Join-Path $publishRoot "Power BI Launcher.exe"
          if (-not (Test-Path -LiteralPath $launcherPath -PathType Leaf)) {
              throw "Published output does not contain Power BI Launcher.exe."
          }

          $versionInfo = (Get-Item -LiteralPath $launcherPath).VersionInfo
          $productVersion = ($versionInfo.ProductVersion -split '\+', 2)[0]
          if ($productVersion -ne $env:LAUNCHER_VERSION) {
              throw "Published ProductVersion '$productVersion' does not match '$($env:LAUNCHER_VERSION)'."
          }

          $expectedFileVersion = "$($env:NUMERIC_VERSION).0"
          if ($versionInfo.FileVersion -ne $expectedFileVersion) {
              throw "Published FileVersion '$($versionInfo.FileVersion)' does not match '$expectedFileVersion'."
          }

          $stageRoot = Join-Path $env:RUNNER_TEMP "pbi-launcher-release"
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          Remove-Item -LiteralPath $stageRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $artifactRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stageRoot, $artifactRoot | Out-Null

          Get-ChildItem -LiteralPath $publishRoot -Recurse -File |
              Where-Object { $_.Extension -ne ".pdb" } |
              ForEach-Object {
                  $relativePath = [IO.Path]::GetRelativePath($publishRoot, $_.FullName)
                  $destination = Join-Path $stageRoot $relativePath
                  $destinationDirectory = Split-Path -Parent $destination
                  New-Item -ItemType Directory -Path $destinationDirectory -Force | Out-Null
                  Copy-Item -LiteralPath $_.FullName -Destination $destination
              }

          $stagedFiles = @(Get-ChildItem -LiteralPath $stageRoot -Recurse -File)
          if ($stagedFiles.Count -eq 0) {
              throw "Release staging directory is empty."
          }

          if ($stagedFiles | Where-Object { $_.Extension -eq ".pdb" }) {
              throw "Release staging directory contains PDB files."
          }

          $archivePath = Join-Path $artifactRoot $env:ARCHIVE_NAME
          Compress-Archive -Path (Join-Path $stageRoot "*") -DestinationPath $archivePath
          if (-not (Test-Path -LiteralPath $archivePath -PathType Leaf) -or
              (Get-Item -LiteralPath $archivePath).Length -eq 0) {
              throw "Release archive is missing or empty."
          }

          $archive = [IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
              $entries = @($archive.Entries)
              if ($entries.Count -eq 0) {
                  throw "Release archive has no entries."
              }

              if ($entries | Where-Object { $_.FullName -match '(?i)\.pdb$' }) {
                  throw "Release archive contains PDB files."
              }

              if (-not ($entries | Where-Object { $_.FullName -eq "Power BI Launcher.exe" })) {
                  throw "Power BI Launcher.exe is not at the release archive root."
              }
          }
          finally {
              $archive.Dispose()
          }

          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$archivePath.sha256"
          Set-Content -LiteralPath $checksumPath -Value "$hash  $($env:ARCHIVE_NAME)" -NoNewline

          $checksumLine = Get-Content -LiteralPath $checksumPath -Raw
          if ($checksumLine -ne "$hash  $($env:ARCHIVE_NAME)") {
              throw "SHA-256 checksum file does not match the release archive."
          }

          "archive_path=$archivePath" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: pwsh
        env:
          ARCHIVE_PATH: ${{ steps.assets.outputs.archive_path }}
          CHECKSUM_PATH: ${{ steps.assets.outputs.checksum_path }}
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.release.outputs.is_prerelease }}
          LAUNCHER_VERSION: ${{ steps.release.outputs.version }}
          NOTES_PATH: ${{ steps.release.outputs.notes_path }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $channel = if ($env:IS_PRERELEASE -eq "true") { "--prerelease" } else { "--latest" }
          gh release create "$env:RELEASE_TAG" `
            "$env:ARCHIVE_PATH" `
            "$env:CHECKSUM_PATH" `
            --repo "$env:GITHUB_REPOSITORY" `
            --verify-tag `
            --title "Power BI Launcher v$env:LAUNCHER_VERSION" `
            --notes-file "$env:NOTES_PATH" `
            $channel
