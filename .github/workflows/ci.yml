name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "Power BI Launcher.Tests/Power BI Launcher.Tests.csproj"

      # If WindowsCredentialStoreTests fails on the hosted runner (CredWrite rejected),
      # add: --filter "Category!=Integration"
      - name: Test
        run: >
          dotnet test "Power BI Launcher.Tests/Power BI Launcher.Tests.csproj"
          -c Release
          --no-restore
          --logger trx
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults
